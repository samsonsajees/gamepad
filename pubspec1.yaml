name: mobile_gamepad
description: Cross-platform mobile gamepad — Racing Edition
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Sensors
  sensors_plus: ^5.0.1

  # Haptics
  vibration: ^2.0.0

  # Background keep-alive (Android)
  flutter_foreground_task: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
